<body class="body-padding">
  <div class="container">
    <div class="header-actions">
      <button class="button-content" routerLink="add">+ Add New Graph</button>
    </div>

    <mat-card class="card p-4" appearance="outlined">
      <div class="graph-grid">
        <div *ngFor="let options of savedGraphs" class="graph-card">
          <div class="chart-container">
            <canvasjs-chart [options]="options" [styles]="{width: '100%', height: '300px'}"></canvasjs-chart>
          </div>

          <div class="card-actions">
            <mat-card-actions class="p-0 mt-2">
              <button mat-raised-button color="primary" (click)="deleteGraph(options.id)">
                <i class="fa fa-trash"></i> Delete Graph
              </button>
            </mat-card-actions>
          </div>
        </div>
      </div>
    </mat-card>
  </div>
</body>
