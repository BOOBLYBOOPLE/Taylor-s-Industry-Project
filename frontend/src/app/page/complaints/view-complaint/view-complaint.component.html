<body class="body-padding">
  <div class="container" *ngIf="complaint;">

    <mat-card class="card p-4" appearance="outlined">
      <div class="d-flex justify-content-between align-items-center">
        <h1 class="mt-2 fw-bold fs-2">Complaint Details</h1>
      </div>

      <mat-card-header class="p-0 mb-4">
        <mat-card-title>Reporter: {{ complaint.employeeId?.name || 'Unknown' }}</mat-card-title>
        <mat-card-subtitle>Targeted Employee: {{ complaint.targetedEmployee?.name || 'N/A' }}</mat-card-subtitle>
      </mat-card-header>

      <mat-divider></mat-divider>

      <div class="row mt-4 mb-2">
        <div class="col-md-4">
          <label class="fw-bold text-muted">Date of Incident:</label>
          <p>{{ complaint.date | date:'mediumDate' }}</p>
        </div>

        <div class="col-md-4">
          <label class="fw-bold text-muted">Type:</label>
          <p>{{ complaint.type }}</p>
        </div>

        <div class="col-md-4">
          <label class="fw-bold text-muted">Summary:</label>
          <p>{{ complaint.summary }}</p>
        </div>
      </div>

      <mat-divider class="mb-4"></mat-divider>

      <div>
        <label class="fw-bold text-muted mb-2">Description:</label>
        <div class="border rounded p-3 bg-light" [innerHTML]="complaint.content"></div>
      </div>

      <mat-card-actions class="p-0 mt-4 gap-4">
        <button mat-button mat-raised-button color="primary" (click)="goBack()">
         <i class="fa fa-arrow-left me-2"></i>  Return
        </button>
        <button mat-button mat-raised-button color="accent" *ngIf="!complaint.resolved" (click)="markAsResolved()">
          <i class="fa fa-check me-2"></i>Resolve
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</body>
