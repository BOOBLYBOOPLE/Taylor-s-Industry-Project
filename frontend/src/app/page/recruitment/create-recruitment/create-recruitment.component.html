<body class="body-padding">
  <div class="container">
    <mat-card class="card card-body p-4" appearance="outlined">
      <div class="d-flex flex-row align-items-center">
        <h1 class="mt-2 fw-bold fs-3 mb-3">Create Recruitment Entry</h1>
      </div>

      <form (ngSubmit)="onSubmit()" #recForm="ngForm">
        <div>
          <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Choose a date</mat-label>
              <input matInput [matDatepicker]="picker" [(ngModel)]="formData.date" name="date">
              <mat-hint>MM/DD/YYYY</mat-hint>
              <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
          </div>

        <div class="mb-3">
          <label>Name:</label>
          <input type="text" [(ngModel)]="formData.name" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
          <label>University:</label>
          <input type="text" [(ngModel)]="formData.University" name="university" class="form-control">
        </div>

        <div class="mb-3">
          <label>Age:</label>
          <input type="number" [(ngModel)]="formData.age" name="age" class="form-control">
        </div>

        <div class="mb-3">
          <label>Resume Document:</label>
          <input type="file" (change)="onFileSelected($event)" class="form-control">
        </div>

        <div class="mb-3">
          <label class="d-block mb-2">Tell us about yourself</label>
          <quill-editor [(ngModel)]="formData.description" name="description" [modules]="quillConfig" [styles]="quillStyle"></quill-editor>
        </div>

        <div class="mb-3">
          <label class="d-block mb-2">Job Experience</label>
          <quill-editor [(ngModel)]="formData.exp" name="description" [modules]="quillConfig" [styles]="quillStyle"></quill-editor>
        </div>

          <div class="d-flex justify-content-start gap-2 mb-3">
            <button class="btn btn-primary" (click)="goBack()"><i class="fa fa-cancel"></i> Cancel</button>
            <button type="submit" class="btn btn-success"><i class="fa fa-upload"></i>  Submit Application</button>
          </div>
        </div>
      </form>
    </mat-card>
  </div>
</body>
