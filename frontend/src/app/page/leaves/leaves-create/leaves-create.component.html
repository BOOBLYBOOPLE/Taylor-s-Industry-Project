<body class="body-padding">
  <div class="container">
    <mat-card class="card card-body p-4" appearance="outlined">
      <div class="d-flex flex-row align-items-center">
        <h1 class="mt-2 mb-3 fw-bold fs-3">{{ isEditMode ? 'Update' : 'Submit' }} Leave Application</h1>
      </div>

      <form [formGroup]="leavesForm" (ngSubmit)="onSubmit()">
        <div>
          <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Select Employee</mat-label>
              <mat-select formControlName="employeeId" (selectionChange)="onEmployeeSelect($event)">
                <mat-option *ngFor="let employee of employees" [value]="employee._id" class="md-button">
                  {{employee.name}}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <div class="mb-3">
             <mat-form-field appearance="outline" class="w-100">
              <mat-label>Leave Duration</mat-label>
              <mat-date-range-input [rangePicker]="picker">
                <input matStartDate formControlName="dateStart" placeholder="Start Date">
                <input matEndDate formControlName="dateEnd" placeholder="End Date">
              </mat-date-range-input>
              <mat-hint>DD-MM-YYYY - DD-MM-YYYY</mat-hint>
              <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-date-range-picker #picker></mat-date-range-picker>
            </mat-form-field>
          </div>

          <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Type</mat-label>
              <mat-select formControlName="type">
                <mat-option *ngFor="let type of leavesTypes" [value]="type" class="md-button">
                  {{type}}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Status</mat-label>
              <mat-select formControlName="status">
                <mat-option *ngFor="let status of status" [value]="status" class="md-button">
                  {{status}}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <div class="mb-3">
            <input type="checkbox" formControlName="paid">  Paid Leave?
          </div>

          <div class="mb-3">
            <label class="d-block mb-2">Description (Optional)</label>
            <quill-editor formControlName="content" [modules]="quillConfig" [styles]="quillStyle"></quill-editor>
          </div>

          <div class="d-flex justify-content-start gap-2 mb-3">
            <button class="btn btn-primary" (click)="goBack()"><i class="fa fa-cancel"></i>Cancel</button>
            <button class="btn btn-success" type="submit"><i class="fa fa-check"></i>{{ isEditMode ? 'Update' : 'Submit' }}</button>
          </div>
        </div>
      </form>
    </mat-card>
  </div>
</body>
